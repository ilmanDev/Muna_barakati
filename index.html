<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengingat Ramadan 2026 • CodeMuna</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --primary:#16a34a;
  --accent:#ca8a04;
  --text:#0f172a;
  --border:#e5e7eb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top,#dcfce7,#f8fafc);
  color:var(--text);
}
.container{max-width:420px;margin:auto;padding:16px}
.card{
  background:var(--card);
  border-radius:22px;
  padding:22px;
  box-shadow:0 18px 40px rgba(0,0,0,.12);
}
h1{
  font-family:Amiri,serif;
  text-align:center;
  color:var(--accent);
  font-size:28px;
}
.subtitle{text-align:center;font-size:13px;opacity:.7;margin-bottom:16px}
.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}
.box{
  background:linear-gradient(160deg,#16a34a,#22c55e);
  color:white;
  border-radius:16px;
  padding:12px 6px;
  text-align:center;
}
.box h2{font-size:20px}
.box span{font-size:11px}
label{display:block;margin:14px 0 6px;font-weight:600;color:#15803d}
select{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
}
.prayer div{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}
.btn{
  margin-top:18px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#22c55e;
  font-weight:600;
}
footer{text-align:center;font-size:12px;opacity:.6;margin-top:14px}

@media(min-width:768px){
  body::before{
    content:"📱 Khusus Tampilan HP";
    position:fixed;
    inset:0;
    background:#020617;
    color:#facc15;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
  }
  .container{display:none}
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<h1>🕌 Ramadan 1447 H</h1>
<div class="subtitle">Pengingat Ramadan 2026 • by CodeMuna</div>

<div class="countdown">
  <div class="box"><h2 id="d">0</h2><span>Hari</span></div>
  <div class="box"><h2 id="h">0</h2><span>Jam</span></div>
  <div class="box"><h2 id="m">0</h2><span>Menit</span></div>
  <div class="box"><h2 id="s">0</h2><span>Detik</span></div>
</div>

<label>📍 Pilih Kabupaten / Kota</label>
<select id="kota" onchange="updateJadwal()">
  <option value="">-- Pilih Lokasi --</option>
  <option value="jakarta">Jakarta</option>
  <option value="bandung">Bandung</option>
  <option value="surabaya">Surabaya</option>
  <option value="makassar">Makassar</option>
  <option value="kendari">Kendari</option>
  <option value="muna">Kabupaten Muna</option>
</select>

<label>⏰ Jadwal Sholat</label>
<div class="prayer">
  <div><span>Subuh</span><span id="subuh">--:--</span></div>
  <div><span>Dzuhur</span><span id="dzuhur">--:--</span></div>
  <div><span>Ashar</span><span id="ashar">--:--</span></div>
  <div><span>Maghrib</span><span id="maghrib">--:--</span></div>
  <div><span>Isya</span><span id="isya">--:--</span></div>
</div>

<button class="btn" onclick="openLink()">🔗 Buka Link Utama</button>
<footer>Stabil • Tanpa API • Mobile Only</footer>

</div>
</div>

<script>
/* COUNTDOWN */
const target=new Date("2026-02-18T18:00:00").getTime();
setInterval(()=>{
 const now=Date.now(),diff=target-now;
 if(diff<=0)return;
 d.textContent=Math.floor(diff/86400000);
 h.textContent=Math.floor(diff%86400000/3600000);
 m.textContent=Math.floor(diff%3600000/60000);
 s.textContent=Math.floor(diff%60000/1000);
},1000);

/* DATA JADWAL SHOLAT */
const jadwal={
 jakarta:{subuh:"04:32",dzuhur:"12:02",ashar:"15:23",maghrib:"18:12",isya:"19:25"},
 bandung:{subuh:"04:29",dzuhur:"12:00",ashar:"15:20",maghrib:"18:09",isya:"19:21"},
 surabaya:{subuh:"04:20",dzuhur:"11:55",ashar:"15:16",maghrib:"18:01",isya:"19:12"},
 makassar:{subuh:"04:44",dzuhur:"12:06",ashar:"15:27",maghrib:"18:15",isya:"19:26"},
 kendari:{subuh:"04:36",dzuhur:"12:03",ashar:"15:25",maghrib:"18:13",isya:"19:24"},
 muna:{subuh:"04:38",dzuhur:"12:04",ashar:"15:26",maghrib:"18:14",isya:"19:25"}
};

function updateJadwal(){
 const k=kota.value;
 if(!jadwal[k])return;
 subuh.textContent=jadwal[k].subuh;
 dzuhur.textContent=jadwal[k].dzuhur;
 ashar.textContent=jadwal[k].ashar;
 maghrib.textContent=jadwal[k].maghrib;
 isya.textContent=jadwal[k].isya;
}

function openLink(){
 window.open("https://droid10.my.id","_blank");
}
</script>
</body>
</html>
