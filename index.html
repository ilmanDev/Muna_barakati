<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muna Barakati | Register</title>

<style>
:root{
  --bg:#020617;
  --card:#020b1c;
  --border:#0f1f3a;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --primary:#38bdf8;
  --glow:#0ea5e9;
}

body.light{
  --bg:#eef5ff;
  --card:#ffffff;
  --border:#c7d2fe;
  --text:#020617;
  --muted:#475569;
  --primary:#2563eb;
  --glow:#3b82f6;
}

*{
  box-sizing:border-box;
  font-family:'Segoe UI',system-ui,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#020b3a,transparent 60%),var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
  color:var(--text);
}

/* CARD */
.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  padding:22px;
  border-radius:26px;
  border:1px solid var(--border);
  box-shadow:0 0 40px rgba(56,189,248,.25);
}

/* SWITCH */
.theme-switch{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}

.switch-box{
  background:var(--card);
  padding:6px 10px;
  border-radius:18px;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
}

.switch{
  position:relative;
  width:42px;
  height:22px;
}

.switch input{display:none;}

.slider{
  position:absolute;
  inset:0;
  background:#020617;
  border-radius:20px;
  transition:.3s;
}

.slider:before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  left:2px;
  top:2px;
  background:#38bdf8;
  border-radius:50%;
  transition:.3s;
  box-shadow:0 0 10px var(--glow);
}

input:checked + .slider{
  background:#dbeafe;
}

input:checked + .slider:before{
  transform:translateX(20px);
  background:#2563eb;
}

/* BRAND */
.brand{
  text-align:center;
  margin-bottom:18px;
}

.brand .logo{
  width:76px;
  height:76px;
  margin:0 auto 10px;
  border-radius:24px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  color:#020617;
  box-shadow:0 0 30px var(--glow);
}

.brand h1{
  font-size:18px;
  margin:0;
}

.brand span{
  font-size:12px;
  color:var(--muted);
}

p{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-bottom:18px;
}

/* FORM */
.input-group{
  margin-bottom:14px;
}

label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}

input,select{
  width:100%;
  padding:15px;
  border-radius:16px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
}

input:focus,select:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 12px var(--glow);
}

/* BUTTON */
.button-wrap{
  margin-top:22px;
}

button.main{
  width:100%;
  height:56px;
  border:none;
  border-radius:28px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  color:#020617;
  font-size:17px;
  font-weight:800;
  box-shadow:0 12px 30px rgba(56,189,248,.45);
}

button.main:active{
  transform:scale(.97);
}

/* LOGIN */
.login-link{
  margin-top:14px;
  text-align:center;
  font-size:13px;
}

.login-link a{
  color:var(--primary);
  font-weight:700;
  text-decoration:none;
}

.footer{
  margin-top:18px;
  text-align:center;
  font-size:11px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">

  <!-- SWITCH -->
  <div class="theme-switch">
    <div class="switch-box">
      🌙
      <label class="switch">
        <input type="checkbox" id="modeSwitch">
        <span class="slider"></span>
      </label>
      ☀️
    </div>
  </div>

  <!-- BRAND -->
  <div class="brand">
    <div class="logo">MB</div>
    <h1>MUNA BARAKATI</h1>
    <span>Register Paket</span>
  </div>

  <p>Isi data dengan benar</p>

  <div class="input-group">
    <label>Nama</label>
    <input id="nama">
  </div>

  <div class="input-group">
    <label>Kode Toko</label>
    <input id="kodeToko">
  </div>

  <div class="input-group">
    <label>Nama Toko</label>
    <input id="namaToko">
  </div>

  <div class="input-group">
    <label>WhatsApp</label>
    <input id="wa">
  </div>

  <div class="input-group">
    <label>Email</label>
    <input id="email">
  </div>

  <div class="input-group">
    <label>Paket</label>
    <select id="paket">
      <option value="">-- Pilih Paket --</option>
      <option>1 Bulan - Rp150.000</option>
    </select>
  </div>

  <div class="button-wrap">
    <button class="main" onclick="kirimWA()">Daftar Sekarang</button>
  </div>

  <div class="login-link">
    Sudah punya akun?
    <a href="https://droid10.my.id/" target="_blank">Login</a>
  </div>

  <div class="footer">© 2026 Muna Barakati</div>

</div>

<script>
/* DARK / LIGHT */
const sw=document.getElementById("modeSwitch");
if(localStorage.theme==="light"){
  document.body.classList.add("light");
  sw.checked=true;
}
sw.onchange=()=>{
  document.body.classList.toggle("light");
  localStorage.theme=document.body.classList.contains("light")?"light":"dark";
};

/* WA */
function kirimWA(){
  if(!nama.value||!kodeToko.value||!namaToko.value||!wa.value||!email.value||!paket.value){
    alert("Lengkapi semua data!");
    return;
  }
  const msg=`📌 PENDAFTARAN MUNA BARAKATI
👤 Nama: ${nama.value}
🏪 Kode: ${kodeToko.value}
🏬 Toko: ${namaToko.value}
📱 WA: ${wa.value}
📧 Email: ${email.value}
📦 Paket: ${paket.value}`;
  window.open("https://wa.me/6287872921421?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
