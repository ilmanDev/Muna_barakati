<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muna Barakati | Register</title>

<style>
/* ================= INDOMARET DEFAULT ================= */
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;

  --primary:#005cab;
  --secondary:#e11d2e;
  --accent:#facc15;

  --ok:#16a34a;
  --err:#dc2626;
}

/* ================= TECH ================= */
body.tech{
  --bg:#eef5ff;
  --card:#ffffff;
  --border:#c7d2fe;
  --text:#020617;
  --muted:#475569;

  --primary:#2563eb;
  --secondary:#3b82f6;
  --accent:#60a5fa;
}

*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#fff,var(--bg));
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
  color:var(--text);
}

/* ================= LOADING ================= */
#loading{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.loading-text{
  font-size:28px;
  font-weight:900;
  color:var(--primary);
}
.progress{
  width:160px;
  height:6px;
  background:#e5e7eb;
  border-radius:10px;
  margin-top:14px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));
  animation:load 1.8s forwards;
}
@keyframes load{to{width:100%}}
.loading-note{font-size:12px;color:var(--muted);margin-top:8px}

/* ================= CARD ================= */
.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  padding:22px;
  border-radius:22px;
  border:1px solid var(--border);
  box-shadow:0 18px 40px rgba(0,0,0,.08);
}

/* ================= SWITCH ================= */
.theme-switch{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  font-size:12px;
  font-weight:700;
}
.theme-switch span{color:#9ca3af}
.theme-switch span.active{color:var(--primary)}

.switch{
  position:relative;
  width:44px;
  height:22px;
}
.switch input{display:none}
.slider{
  position:absolute;
  inset:0;
  background:#e5e7eb;
  border-radius:20px;
  cursor:pointer;
}
.slider:before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  left:2px;
  top:2px;
  background:var(--primary);
  border-radius:50%;
  transition:.3s;
}
.switch input:checked + .slider:before{
  transform:translateX(22px);
}

/* ================= BRAND ================= */
.brand{text-align:center;margin-bottom:16px}
.brand h1{
  margin:0;
  font-size:22px;
  font-weight:900;
  color:var(--primary);
}
.brand .line{
  display:flex;
  justify-content:center;
  gap:6px;
  margin:6px 0;
}
.brand .line span{
  width:26px;height:4px;border-radius:4px
}
.b{background:var(--primary)}
.r{background:var(--secondary)}
.y{background:var(--accent)}
.brand small{font-size:12px;color:var(--muted)}

p{text-align:center;font-size:13px;color:var(--muted)}

/* ================= FORM ================= */
.input-group{margin-bottom:14px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
input,select{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1.5px solid var(--border);
  background:#f9fafb;
}
input.valid{border-color:var(--ok)}
input.invalid{border-color:var(--err)}
.hint{font-size:11px;margin-top:4px}
.hint.ok{color:var(--ok)}
.hint.err{color:var(--err)}

/* ================= BUTTON ================= */
button.main{
  width:100%;
  height:56px;
  border:none;
  border-radius:28px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  font-size:17px;
  font-weight:800;
  margin-top:10px;
}
button.main:disabled{opacity:.5}

.payment{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}
button.qris{
  border:2px solid var(--secondary);
  background:#fff;
  color:var(--secondary);
  border-radius:20px;
  height:50px;
  font-weight:800;
}
button.dana{
  background:linear-gradient(135deg,var(--accent),#f59e0b);
  border:none;
  border-radius:20px;
  height:50px;
  font-weight:800;
}

/* ================= TOAST ================= */
.toast{
  position:fixed;
  top:-60px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 20px;
  border-radius:20px;
  color:#fff;
  font-size:13px;
  font-weight:700;
  background:var(--primary);
  transition:.4s;
  z-index:99999;
}
.toast.show{top:18px}
.toast.error{background:#dc2626}
.toast.success{background:#16a34a}
</style>
</head>

<body>

<div id="loading">
  <div class="loading-text">MUNA BARAKATI</div>
  <div class="progress"><div class="bar"></div></div>
  <div class="loading-note">Memuat sistem…</div>
</div>

<div class="toast" id="toast"></div>

<div class="card">

<div class="theme-switch">
  <span id="indo" class="active">INDO</span>
  <label class="switch">
    <input type="checkbox" id="themeSwitch">
    <span class="slider"></span>
  </label>
  <span id="tech">TECH</span>
</div>

<div class="brand">
  <h1>MUNA BARAKATI</h1>
  <div class="line"><span class="b"></span><span class="r"></span><span class="y"></span></div>
  <small>Register Paket</small>
</div>

<p>Isi data toko dengan benar</p>

<div class="input-group"><label>Nama</label><input id="nama"></div>
<div class="input-group"><label>Kode Toko</label><input id="kodeToko"></div>
<div class="input-group"><label>Nama Toko</label><input id="namaToko"></div>

<div class="input-group">
  <label>WhatsApp</label>
  <input id="wa" placeholder="08xxxxxxxxxx">
  <div id="waHint" class="hint"></div>
</div>

<div class="input-group">
  <label>Email</label>
  <input id="email" placeholder="email@domain.com">
  <div id="emailHint" class="hint"></div>
</div>

<div class="input-group">
  <label>Paket</label>
  <select id="paket">
    <option value="">-- Pilih Paket --</option>
    <option>1 Bulan - Rp50.000</option>
  </select>
</div>

<button class="main" id="btn" onclick="kirimWA()" disabled>DAFTAR SEKARANG</button>

<div class="payment">
  <button class="qris">QRIS</button>
  <button class="dana">DANA</button>
</div>

</div>

<script>
/* LOADING */
window.onload=()=>setTimeout(()=>loading.style.display="none",1800);

/* TOAST */
const toast=document.getElementById("toast");
function showToast(msg,type=""){
  toast.textContent=msg;
  toast.className="toast show "+type;
  setTimeout(()=>toast.className="toast",2200);
}

/* THEME */
const sw=document.getElementById("themeSwitch");
const indo=document.getElementById("indo");
const tech=document.getElementById("tech");

if(localStorage.theme==="tech"){
  document.body.classList.add("tech");
  sw.checked=true;
  indo.classList.remove("active");
  tech.classList.add("active");
}

sw.onchange=()=>{
  document.body.classList.toggle("tech");
  const t=document.body.classList.contains("tech");
  localStorage.theme=t?"tech":"indo";
  indo.classList.toggle("active",!t);
  tech.classList.toggle("active",t);
  showToast(t?"Tema TECH aktif":"Tema INDOMARET aktif","success");
};

/* VALIDASI */
const btn=document.getElementById("btn");
function validWA(v){return /^(08|62)\d{8,13}$/.test(v.replace(/\D/g,""))}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}

function check(){
  btn.disabled=!(
    nama.value&&kodeToko.value&&namaToko.value&&paket.value&&
    validWA(wa.value)&&validEmail(email.value)
  );
}

wa.oninput=()=>{
  wa.value=wa.value.replace(/[^0-9]/g,"");
  if(validWA(wa.value)){
    wa.className="valid";waHint.textContent="WhatsApp valid";waHint.className="hint ok";
  }else{
    wa.className="invalid";waHint.textContent="Format WA salah";waHint.className="hint err";
  }
  check();
};

email.oninput=()=>{
  if(validEmail(email.value)){
    email.className="valid";emailHint.textContent="Email valid";emailHint.className="hint ok";
  }else{
    email.className="invalid";emailHint.textContent="Email tidak valid";emailHint.className="hint err";
  }
  check();
};

[nama,kodeToko,namaToko,paket].forEach(i=>i.oninput=check);

function kirimWA(){
  if(btn.disabled){
    showToast("Lengkapi data dengan benar","error");
    return;
  }
  showToast("Data valid, mengirim...","success");
}
</script>

</body>
</html>
